spring.application.name=BookStore
server.port=1001
# Default: H2 for easy local/demo use. Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:file:./data/bookstore;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.secret=change-this-development-secret-key-to-at-least-32-characters
app.jwt.expiration-ms=86400000
app.mail.enabled=false
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
