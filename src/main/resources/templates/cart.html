<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Cart</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h1>Your Cart</h1><div class="card" th:each="i:${items}"><b th:text="${i.book.name}"></b> · Qty: <span th:text="${i.quantity}"></span> · ₹<span th:text="${i.book.price*i.quantity}"></span><form style="display:inline" method="post" th:action="@{'/cart/remove/'+${i.id}}"><button class="danger">Remove</button></form></div><h2>Total: ₹<span th:text="${total}"></span></h2><a class="button" href="/checkout">Checkout</a></main></body></html>
