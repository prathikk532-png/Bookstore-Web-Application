<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Book Details</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><div class="card"><h1 th:text="${book.name}"></h1><p><b>Author:</b> <span th:text="${book.author}"></span></p><p><b>Category:</b> <span th:text="${book.category}"></span></p><p th:text="${book.description}"></p><h2>₹<span th:text="${book.price}"></span></h2><p>Stock: <span th:text="${book.stock}"></span></p><form method="post" th:action="@{'/cart/add/'+${book.id}}"><input name="quantity" type="number" min="1" value="1"><button>Add to Cart</button></form></div><div class="card"><h2>Reviews & Ratings</h2><div th:each="r:${reviews}"><b th:text="${r.user.username}"></b> · <span th:text="${r.rating}"></span>/5<p th:text="${r.comment}"></p></div><form method="post" th:action="@{'/books/'+${book.id}+'/review'}"><input name="rating" type="number" min="1" max="5" placeholder="Rating 1-5" required><textarea name="comment" placeholder="Your review" required></textarea><button>Submit Review</button></form></div></main></body></html>
