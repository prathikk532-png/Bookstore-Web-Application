<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h1>Admin Dashboard</h1><div class="stats"><div>Books <b th:text="${bookCount}"></b></div><div>Users <b th:text="${userCount}"></b></div><div>Orders <b th:text="${orderCount}"></b></div><div>Low Stock <b th:text="${lowStock}"></b></div></div><h2>Users</h2><div class="card" th:each="u:${users}"><span th:text="${u.username}"></span> · <span th:text="${u.email}"></span> · <b th:text="${u.role}"></b><form method="post" th:action="@{'/admin/users/'+${u.id}+'/role'}"><select name="role"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select><button>Change Role</button></form></div><h2>Orders</h2><div class="card" th:each="o:${orders}">#<span th:text="${o.id}"></span> · <span th:text="${o.user.username}"></span> · ₹<span th:text="${o.total}"></span> · <b th:text="${o.status}"></b><form method="post" th:action="@{'/admin/orders/'+${o.id}+'/status'}"><select name="status"><option th:each="s:${T(com.bookstore.entity.OrderStatus).values()}" th:value="${s}" th:text="${s}"></option></select><button>Update</button></form></div></main></body></html>
