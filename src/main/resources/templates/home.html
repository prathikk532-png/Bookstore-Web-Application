<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>BookStore</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><section class="hero"><h1>BookStore Web Application</h1><p>Discover, manage and order books.</p></section><form class="search" method="get" action="/"><input name="q" th:value="${q}" placeholder="Search by book or author"><input name="category" placeholder="Category"><button>Search</button><a href="/books/new" class="button">Add Book</a></form><div class="grid"><article class="card" th:each="b:${books}"><h2 th:text="${b.name}"></h2><p><b>Author:</b> <span th:text="${b.author}"></span></p><p><b>Category:</b> <span th:text="${b.category}"></span></p><p th:text="${b.description}"></p><p class="price">₹<span th:text="${b.price}"></span> · Stock: <span th:text="${b.stock}"></span></p><a class="button" th:href="@{'/books/'+${b.id}}">View</a><a class="button secondary" th:href="@{'/books/edit/'+${b.id}}">Edit</a><form th:action="@{'/books/delete/'+${b.id}}" method="post" style="display:inline"><button class="danger">Delete</button></form></article></div></main></body></html>
