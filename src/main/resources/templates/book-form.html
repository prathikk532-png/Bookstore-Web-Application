<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Book</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="formbox"><h1 th:text="${book.id==null?'Add Book':'Edit Book'}"></h1><form action="/books/save" method="post" th:object="${book}"><input type="hidden" th:field="*{id}"><input th:field="*{name}" placeholder="Book name" required><input th:field="*{author}" placeholder="Author" required><input th:field="*{category}" placeholder="Category" required><textarea th:field="*{description}" placeholder="Description" required></textarea><input th:field="*{price}" type="number" step="0.01" placeholder="Price" required><input th:field="*{stock}" type="number" min="0" placeholder="Stock" required><input th:field="*{imageUrl}" placeholder="Image URL (optional)"><button>Save</button></form></main></body></html>
